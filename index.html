<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Script AI App Builder</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  height:65px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.badge{
  background:#171717;
  border:1px solid #333;
  padding:10px 15px;
  border-radius:25px;
}

main{
  max-width:850px;
  margin:auto;
  padding:55px 20px;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:#999;
  font-size:18px;
  margin-bottom:40px;
}

.box{
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  padding:25px;
}

textarea{
  width:100%;
  min-height:210px;
  resize:vertical;
  background:#080808;
  color:#fff;
  border:1px solid #333;
  border-radius:15px;
  padding:18px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#666;
}

select{
  width:100%;
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  background:#181818;
  color:#fff;
  border:1px solid #333;
  font-size:16px;
}

button{
  width:100%;
  margin-top:18px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#status{
  margin-top:20px;
  background:#080808;
  border-radius:12px;
  padding:18px;
  color:#aaa;
  min-height:55px;
}

#preview{
  margin-top:20px;
  min-height:250px;
  border:1px dashed #333;
  border-radius:15px;
  padding:25px;
  color:#aaa;
  overflow:auto;
}

.app-code{
  white-space:pre-wrap;
  background:#050505;
  border:1px solid #333;
  padding:20px;
  border-radius:12px;
  color:#ddd;
  font-family:monospace;
  text-align:left;
}

@media(max-width:600px){
  h1{
    font-size:32px;
  }

  main{
    padding:35px 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Script</div>
  <div class="badge">AI App Builder</div>
</header>

<main>

<h1>Build Apps With AI</h1>

<div class="subtitle">
Describe your app. Script will build it.
</div>

<div class="box">

<textarea id="prompt"
placeholder="Example: Create a food delivery app with login, restaurant list, cart and order tracking..."></textarea>

<select id="provider">
  <option value="gemini">Google Gemini</option>
  <option value="auto">Auto</option>
</select>

<button id="buildBtn" onclick="buildApp()">
🚀 Build App
</button>

<div id="status">
Ready to build your app.
</div>

<div id="preview">
Your generated app preview will appear here.
</div>

</div>
</main>

<script>

const API_URL = "https://script-ai.mdafroz252738.workers.dev";

async function buildApp(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const provider =
    document.getElementById("provider").value;

  const status =
    document.getElementById("status");

  const preview =
    document.getElementById("preview");

  const button =
    document.getElementById("buildBtn");

  if(!prompt){

    status.innerText =
      "⚠️ Please describe the app you want to build.";

    return;
  }

  button.disabled = true;

  status.innerText =
    "🚀 AI is building your app...";

  preview.innerHTML =
    "<p>⏳ Generating app...</p>";

  try{

    const response = await fetch(
      API_URL + "/build",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt,
          provider:provider
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Server error"
      );
    }

    status.innerText =
      "✅ App generated successfully!";

    let result =
      data.app ||
      data.code ||
      data.result ||
      data.output;

    if(!result){

      result =
        JSON.stringify(data,null,2);
    }

    preview.innerHTML =
      "<h2>🚀 Your AI App</h2>" +
      "<br>" +
      "<div class='app-code'>" +
      escapeHtml(String(result)) +
      "</div>";

  }catch(error){

    console.error(error);

    status.innerText =
      "❌ " + error.message;

    preview.innerHTML =
      "<p>AI server se response nahi mila.</p>" +
      "<br>" +
      "<p>Worker endpoint check karo.</p>";
  }

  button.disabled = false;
}

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
